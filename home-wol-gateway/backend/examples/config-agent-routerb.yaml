# Installed on Router B's LAN. UDP-only, no HTTP -- peers straight to
# raspi-home. peers is required here since Router B's LAN is a different
# subnet from the Mikrotik LAN (broadcast auto-discovery only works within
# the same subnet) -- if you ever add a second node onto Router B's own
# LAN, that one could leave peers empty instead.

node:
  id: agent-routerb
  listen_udp_addr: ":9090"
  peers: ["192.168.88.10:9090"] # raspi-home's Mikrotik-LAN IP
  report_interval: 10s

discovery:
  command: ip
  args: [neigh]
  subnet: "" # set to Router B's LAN CIDR if you want active sweeping

wake:
  broadcast_addr: "255.255.255.255"
  port: 9

security:
  psk: "REPLACE_WITH_same_psk_as_raspi-home"
