global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'mikrotik'
    file_sd_configs:
      - files:
        - /etc/prometheus/file_sd/hosts.json
    metrics_path: /snmp
    params:
      module: [mikrotik]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
